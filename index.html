<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <audio id="mainAudioPlayer" src="../static/audio/My Heart Will Go On - Celine Dion Karaoke【With Guide Melody】 [tQOw_R2gx2E].webm"></audio>
    <div class="main-container">
        <img id="main-bg-img" src="../static/images/main-img.webp">
        <div class="header-container">
            <div class="title-container">
                <h1>Titanic surviving chances MLP AI</h1>
                <span id="title-info">Data based on the 891 passengers of the actual incident</span>
            </div>
        </div>
        <div class="selection-main-container">
            <div class="selection-container">
                <div class="selection-wrapper">
                    <span>Your social class</span>
                    <select class="selection-select" id="selection-select-class" name="class" for="class">
                        <option value="1">1st Class</option>
                        <option value="2">2nd Class</option>
                        <option value="3">3rd Class</option>
                    </select>
                </div>
                <div class="selection-wrapper">
                    <span>Your sex</span>
                    <select class="selection-select" id="selection-select-sex" name="sex" for="sex">
                        <option value="0">Man</option>
                        <option value="1">Women</option>
                    </select>
                </div>
                <div class="selection-wrapper">
                    <span>Your age</span>
                    <select class="selection-select" id="selection-select-age" name="age" for="age"></select>
                </div>
                <div class="selection-wrapper">
                    <span>People you're travelling with</span>
                    <select class="selection-select" id="selection-select-people" name="people" for="people"></select>
                </div>
            </div>
            <div class="selection-send">
                <button id="selection-send-btn">
                    View your chances
                </button>
            </div>
            <div class="results-container"></div>
        </div>
        <div class="muted-container">
            <label class="muted-wrapper">
                <input type="checkbox">
                <svg viewBox="0 0 24 24" class="muted-checkmark-container">
                    <path d="M4.5 12.5 l6 6 9-12.5" id="muted-checkmark"></path>
                </svg>
                <span>Click here to mute</span>
            </label>
        </div>
        </div>
        <div class="footer-container">
            <footer>
                © 2025 - Pablo K.D. Production
            </footer>
        </div>
    </div>
    <script src="../static/script.js"></script>
</body>
</html>
